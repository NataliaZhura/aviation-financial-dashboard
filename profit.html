<section class="aviation-flat-page">
  <div class="flat-header"><h2>Финансовые результаты</h2><p>Все денежные показатели показаны в млн руб. EBITDA = EBIT + амортизация 3% от основных средств.</p></div>
  <div id="profit-message">Загрузка...</div>
  <div class="flat-grid" id="profit-kpis"></div>
  <section class="flat-section"><h3>История финансовых результатов</h3><table class="flat-table" id="profit-table"></table></section>
  <script>
  (function(){function e(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function n(v){return v==null||!isFinite(Number(v))?'-':Number(v).toLocaleString('ru-RU',{maximumFractionDigits:1,minimumFractionDigits:1});}function p(v){return v==null||!isFinite(Number(v))?'-':(Number(v)*100).toLocaleString('ru-RU',{maximumFractionDigits:1})+'%';}function c(a,b,note,neg){return '<article class="flat-card"><div class="flat-label">'+e(a)+'</div><div class="flat-value '+(neg?'flat-negative':'')+'">'+e(b)+'</div><div class="flat-note">'+e(note)+'</div></article>';}var q=window.AVIATION_PERIOD||{year:2024,periodType:'year',quarter:1};google.script.run.withSuccessHandler(function(r){if(!r||r.status!=='success'){document.getElementById('profit-message').textContent=r&&r.error||'Ошибка загрузки';return;}var d=r.data||{},k=d.kpis||{},h=d.history||[],period=d.periodType==='quarter'?d.year+' год, '+d.quarter+' квартал':d.year+' год';document.getElementById('profit-message').innerHTML='<div class="flat-alert '+(d.periodAvailable?'success':'danger')+'">Период: '+e(period)+'. Денежные значения - млн руб.</div>';document.getElementById('profit-kpis').innerHTML=[c('Выручка',k.revenueFormatted,'млн руб.'),c('Прибыль от продаж / EBIT',k.ebitFormatted,'млн руб.',Number(k.ebit)<0),c('Амортизация',k.depreciationFormatted,'млн руб., 3% основных средств'),c('EBITDA',k.ebitdaFormatted,'млн руб.',Number(k.ebitda)<0),c('Чистая прибыль',k.netProfitFormatted,'млн руб.',Number(k.netProfit)<0),c('Рентабельность по чистой прибыли',k.netMarginFormatted,'чистая прибыль / выручка',Number(k.netMargin)<0),c('Рентабельность по EBIT',k.ebitMarginFormatted,'EBIT / выручка',Number(k.ebitMargin)<0),c('Рентабельность по EBITDA',k.ebitdaMarginFormatted,'EBITDA / выручка',Number(k.ebitdaMargin)<0)].join('');document.getElementById('profit-table').innerHTML='<tr><th>Год</th><th>Выручка, млн руб.</th><th>EBITDA, млн руб.</th><th>Чистая прибыль, млн руб.</th><th>Чистая рентабельность</th></tr>'+h.map(function(x){return '<tr><td>'+e(x.year)+'</td><td>'+e(n(x.revenueMln))+'</td><td>'+e(n(x.ebitda==null?null:x.ebitda/1000))+'</td><td class="'+(Number(x.netProfit)<0?'flat-negative':'')+'">'+e(n(x.netProfitMln))+'</td><td>'+e(p(x.netMargin))+'</td></tr>';}).join('');}).withFailureHandler(function(x){document.getElementById('profit-message').textContent=x&&x.message||'Ошибка загрузки';}).getFlatDashboardData(q);}());
  </script>
</section>
