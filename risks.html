<section class="page-card aviation-flat-page">
<style>
  .aviation-flat-page .mini-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:end;height:210px}.aviation-flat-page .mini-bar-item{display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px}.aviation-flat-page .mini-bar{width:58px;min-height:4px;background:#1c6397;border-radius:7px 7px 0 0}.aviation-flat-page .mini-bar.loss{background:#c94d4d}.aviation-flat-page .mini-bar-value,.aviation-flat-page .mini-bar-label{font-size:.78rem;color:#60778d;text-align:center}.aviation-flat-page .grade{font-family:var(--font-display);font-size:4rem;font-weight:900;color:#b52c2c;text-align:center}.aviation-flat-page .score{text-align:center;color:#60778d;font-size:1.05rem}.aviation-flat-page .risk-card{min-height:150px}.aviation-flat-page .risk-card .flat-value{font-size:1rem;line-height:1.45}
</style>
<div class="page-card-header"><div><div class="page-kicker">Раздел 05</div><h3 class="page-card-title">Риски и связи компании</h3><p class="page-card-subtitle">Налоговые, судебные, исполнительные и контрагентские риски по отчетности и выгрузкам источников.</p></div><span class="page-status-pill">Источники и статусы</span></div>
<div id="risks-message" style="padding:22px 26px">Загрузка...</div><div class="flat-grid" id="risk-cards"></div><div class="flat-section"><h4>Зафиксированные риски и связи</h4><table class="flat-table" id="risk-table"></table></div>
<script>
(function(){function e(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function card(a,b,c){return '<article class="flat-card risk-card"><div class="flat-label">'+e(a)+'</div><div class="flat-value">'+e(b)+'</div><div class="flat-note">'+e(c)+'</div></article>';}var p=window.AVIATION_PERIOD||{year:2024,periodType:'year',quarter:1};google.script.run.withSuccessHandler(function(x){if(!x||x.status!=='success'){document.getElementById('risks-message').textContent=x&&x.error||'Ошибка загрузки';return;}var d=x.data||{},facts=d.riskFacts||[],t=d.periodType==='quarter'?d.year+' год, '+d.quarter+' квартал':d.year+' год';document.getElementById('risks-message').innerHTML='<div class="flat-alert">Период финансовых показателей: '+e(t)+'. Риски из отчетности и источников показаны отдельно от модельных расчетов.</div>';document.getElementById('risk-cards').innerHTML=facts.slice(0,6).map(function(a){return card(a.label,a.value,a.status);}).join('');document.getElementById('risk-table').innerHTML='<tr><th>Тип риска или связи</th><th>Значение</th><th>Статус</th></tr>'+facts.map(function(a){return '<tr><td>'+e(a.label)+'</td><td>'+e(a.value)+'</td><td>'+e(a.status)+'</td></tr>';}).join('');}).withFailureHandler(function(x){document.getElementById('risks-message').textContent=x&&x.message||'Ошибка загрузки';}).getFlatDashboardData(p);}());
</script></section>
